name: Build & Release

# On every push to main: build the bootloader and publish a GitHub pre-release with a
# semver tag (vMAJOR.MINOR.PATCH-pre.g<short-sha>). Stable releases (no pre-release label) are
# cut manually. The base version is the next patch above the latest stable tag (or 0.1.0
# when there is none), so a manual stable vX.Y.Z always sorts above these pre-releases.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag lookup)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install "platformio~=6.0"

      - name: Compute pre-release version
        id: ver
        run: |
          sha7=$(git rev-parse --short=7 HEAD)
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            ver="0.1.0-pre.g${sha7}"
          else
            b=${latest#v}
            IFS=. read -r MA MI PA <<< "$b"
            ver="${MA}.${MI}.$((PA + 1))-pre.g${sha7}"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "pre-release version: $ver"

      - name: Build
        run: pio run

      - name: Collect artifacts
        run: |
          v='${{ steps.ver.outputs.version }}'
          mkdir -p dist
          cp .pio/build/x3-vcu-boot/firmware.bin "dist/x3-vcu-boot-$v.bin"
          ( cd dist && sha256sum x3-vcu-boot-* > SHA256SUMS.txt )
          { echo "### Pre-release $v"; echo '```'; ( cd dist && sha256sum x3-vcu-boot-* ); echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${{ steps.ver.outputs.tag }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Automated pre-release built from main (\`${{ github.sha }}\`)." \
            dist/x3-vcu-boot-*.bin dist/SHA256SUMS.txt
