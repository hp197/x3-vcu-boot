name: Build & Release

# On every push to main: build the bootloader with PlatformIO, compute the next
# semantic-version tag from the commit history (conventional commits: fix: -> patch,
# feat: -> minor, a "BREAKING CHANGE"/"!" -> major; default bump = patch), and publish
# a GitHub Release with the firmware artifacts attached.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag computation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install PlatformIO
        run: pip install "platformio~=6.0"

      - name: Build
        run: pio run

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp .pio/build/x3-vcu-boot/firmware.bin dist/x3-vcu-boot.bin
          cp .pio/build/x3-vcu-boot/firmware.hex dist/x3-vcu-boot.hex
          cp .pio/build/x3-vcu-boot/firmware.elf dist/x3-vcu-boot.elf
          ( cd dist && sha256sum x3-vcu-boot.* > SHA256SUMS.txt )
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          ( cd dist && sha256sum x3-vcu-boot.* ) >> "$GITHUB_STEP_SUMMARY"

      - name: Compute next semver tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: |
            dist/x3-vcu-boot.bin
            dist/x3-vcu-boot.hex
            dist/x3-vcu-boot.elf
            dist/SHA256SUMS.txt
