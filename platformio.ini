; x3-vcu-boot -- PlatformIO build for the Segway-Ninebot x3 VCU bootloader
; (Artery AT32F415CBT7, the vehicle-control unit; the MCU/BLE have their own).
;
; Platform:  ArteryTek official -- NOT in the PlatformIO registry, installed from GitHub.
; Framework: at32firmlib -- PlatformIO downloads its own copy of the Artery BSP
;            (BSD-3-Clause), so no local library checkout is needed to build.
;
; Layout:  src/x3-vcu-boot.c   include/at32f415_conf.h   x3-vcu-boot.ld
;
;   pio run             # build
;   pio run -t clean    # clean
;   (upload/debug are intentionally disabled -- see below)

[env:x3-vcu-boot]
; The ArteryTek platform is not in the PlatformIO registry -- install from GitHub.
platform  = https://github.com/ArteryTek/platform-arterytekat32.git
; pin to a tag/commit for reproducibility, e.g.:
; platform = https://github.com/ArteryTek/platform-arterytekat32.git#v1.0.2
board     = genericAT32F415CBT7
framework = at32firmlib

; The AT32F415CBT7 has 128 KB flash, but the bootloader only owns the first 4 KB
; (0x08000000-0x08000FFF). Override the size-check budget so `pio run` reports usage
; against the 4 KB region AND fails the build if the image ever exceeds it. (The real
; limit is enforced by x3-vcu-boot.ld; this just makes the check match.)
board_upload.maximum_size = 4096

; our 4 KB bootloader linker (vectors at 0x08000000, slot0 at 0x08001000).
; board_build.ldscript overrides the BSP default (do not also use -Wl,-T).
board_build.ldscript = x3-vcu-boot.ld

build_flags =
    -I include          ; make at32f415_conf.h visible to the framework (BSP) sources
    -Os
    -ffunction-sections
    -fdata-sections
    -Wall

; --- build-only: flashing & debug are intentionally disabled -----------------
; `pio run` (build) and `pio run -t clean` work; `pio run -t upload` fails on
; purpose. Flash the resulting image manually (openocd / x3utils) over SWD.
upload_protocol = custom
upload_command  = python -c "raise SystemExit('x3-vcu-boot is build-only: upload is disabled.')"
; (no debug_tool set, so `pio debug` is unavailable too)
